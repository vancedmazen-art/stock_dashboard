name: Daily OHLCV Update

on:
  schedule:
    - cron: "0 20 * * *"   # 8 PM UTC (10 PM Cairo)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Run updater
        run: |
          python scripts/update_ohlcv.py

      - name: Commit CSV
        run: |
          git config --global user.name "data-bot"
          git config --global user.email "bot@github.com"

          git add data/egx_ohlcv.csv
          git commit -m "Daily OHLCV update" || echo "No changes"
          git push
