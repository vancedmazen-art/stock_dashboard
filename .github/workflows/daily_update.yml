name: Daily Stock Update

# Trigger workflow manually and on a daily schedule
on:
  workflow_dispatch:   # allows manual run
  schedule:
    - cron: '0 8 * * *'  # runs every day at 08:00 UTC, adjust as needed

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # adjust to your Python version

      # Step 3: Upgrade pip and install dependencies safely
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Step 4: Run your stock update script
      - name: Run daily update
        run: python app.py
