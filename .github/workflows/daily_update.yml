name: EGX Daily Pipeline

on:
  schedule:
    - cron: "0 13 * * 0-4"   # 3 PM Cairo (Sun–Thu)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python main.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/ohlcv.csv
          git commit -m "Daily OHLCV update" || echo "No changes"
          git push
